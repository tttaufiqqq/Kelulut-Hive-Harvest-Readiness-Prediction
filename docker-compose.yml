# Local stack that mirrors the Azure layout: web, worker, scheduler, a one-shot
# migrate step, the flask-ml API and MySQL 8.0 (the Azure server runs 8.0.x).
#
#   cp .env.docker.example .env.docker      # then set APP_KEY
#   docker compose up --build
#   open http://localhost:8080

x-laravel: &laravel
  image: buzzyhive/laravel:local
  env_file: .env.docker
  environment: &laravel-env
    APP_ENV: production
    APP_DEBUG: "false"
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: "3306"
    SESSION_DRIVER: database
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    BROADCAST_CONNECTION: log
    ML_URL: http://flask-ml:5000
    LOG_CHANNEL: stderr
  depends_on:
    mysql:
      condition: service_healthy
    flask-ml:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.0
    # The migrations create a trigger. With binary logging on (the default) MySQL
    # refuses that for a non-SUPER user unless this is set. Azure MySQL Flexible
    # Server needs the same server parameter (see lab/data.tf).
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-buzzyhive}
      MYSQL_USER: ${DB_USERNAME:-hive}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me-locally}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-too}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-change-me-too}"]
      interval: 5s
      timeout: 3s
      retries: 20

  flask-ml:
    build: ./ml
    image: buzzyhive/flask-ml:local
    ports:
      - "5000:5000"

  # One-shot: runs the migrations (and the master data seeder) then exits.
  # Mirrors the "laravel-migrate" Container Apps Job.
  migrate:
    <<: *laravel
    build:
      context: .
      args:
        VITE_PUSHER_APP_KEY: ${PUSHER_APP_KEY:-}
        VITE_PUSHER_APP_CLUSTER: ${PUSHER_APP_CLUSTER:-ap1}
    command: ["sh", "-c", "php artisan migrate --force && php artisan db:seed --class=MasterDataSeeder --force"]
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy

  app:
    <<: *laravel
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      flask-ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    <<: *laravel
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      flask-ml:
        condition: service_healthy

  scheduler:
    <<: *laravel
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  mysql-data:
